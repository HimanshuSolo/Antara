[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Ruff's own defaults (E4, E7, E9, F) -- pinned explicitly so a future
# ruff release changing its default rule set can't silently change what
# CI enforces here.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
